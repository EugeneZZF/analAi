# Готовый конфиг для работы с вашей self-hosted моделью в Ollama на другом ПК в сети.
# Скопируйте этот файл в docker/config.yaml:
#   cp docker/config.ollama.example.yaml docker/config.yaml
# И замените 192.168.1.100 на IP-адрес вашего второго ПК с Ollama, а qwen2.5-coder:14b — на имя вашей модели.

type: llm
provider: litellm_llm
models:
  - alias: default
    # Формат: ollama_chat/<имя_модели_в_ollama>
    # Например: ollama_chat/qwen2.5-coder:14b, ollama_chat/llama3.1:8b, ollama_chat/deepseek-r1:14b
    model: ollama_chat/qwen2.5-coder:14b
    api_base: http://192.168.1.100:11434
    context_window_size: 32768
    timeout: 600
    kwargs:
      n: 1
      temperature: 0

---
# Вариант А (По умолчанию): Локальный встроенный CPU-эмбеддер FastEmbed (не требует настройки на втором ПК)
# Если хотите использовать эмбеддинги тоже через Ollama со второго ПК (например nomic-embed-text),
# см. Вариант Б в комментариях ниже.
type: embedder
provider: fastembed_embedder
models:
  - model: BAAI/bge-small-en-v1.5
    alias: default

# --- Вариант Б (эмбеддинги через Ollama со второго ПК):
# type: embedder
# provider: litellm_embedder
# models:
#   - model: openai/nomic-embed-text
#     alias: default
#     api_base: http://192.168.1.100:11434/v1
#     timeout: 600
# (Для nomic-embed-text укажите ниже embedding_model_dim: 768 вместо 384)

---
type: engine
provider: wren_ui
endpoint: http://wren-ui:3000

---
type: engine
provider: wren_ibis
endpoint: http://ibis-server:8000

---
type: document_store
provider: qdrant
location: http://qdrant:6333
# 384 — для BAAI/bge-small-en-v1.5 (fastembed_embedder)
# 768 — для nomic-embed-text (Ollama)
# 1024 — для bge-m3 (Ollama)
embedding_model_dim: 384
timeout: 120
recreate_index: true

---
type: pipeline
pipes:
  - name: db_schema_indexing
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: historical_question_indexing
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: table_description_indexing
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: db_schema_retrieval
    llm: litellm_llm.default
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: historical_question_retrieval
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: sql_generation
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: sql_correction
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: followup_sql_generation
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: sql_answer
    llm: litellm_llm.default
  - name: semantics_description
    llm: litellm_llm.default
  - name: relationship_recommendation
    llm: litellm_llm.default
  - name: question_recommendation
    llm: litellm_llm.default
  - name: question_recommendation_sql_generation
    llm: litellm_llm.default
    engine: wren_ui
    document_store: qdrant
  - name: intent_classification
    llm: litellm_llm.default
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: misleading_assistance
    llm: litellm_llm.default
  - name: data_assistance
    llm: litellm_llm.default
  - name: sql_pairs_indexing
    document_store: qdrant
    embedder: fastembed_embedder.default
  - name: sql_pairs_retrieval
    document_store: qdrant
    embedder: fastembed_embedder.default
    llm: litellm_llm.default
  - name: preprocess_sql_data
    llm: litellm_llm.default
  - name: sql_executor
    engine: wren_ui
  - name: chart_generation
    llm: litellm_llm.default
  - name: chart_adjustment
    llm: litellm_llm.default
  - name: user_guide_assistance
    llm: litellm_llm.default
  - name: sql_question_generation
    llm: litellm_llm.default
  - name: sql_generation_reasoning
    llm: litellm_llm.default
  - name: followup_sql_generation_reasoning
    llm: litellm_llm.default
  - name: sql_regeneration
    llm: litellm_llm.default
    engine: wren_ui
  - name: instructions_indexing
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: instructions_retrieval
    embedder: fastembed_embedder.default
    document_store: qdrant
  - name: sql_functions_retrieval
    engine: wren_ibis
    document_store: qdrant
  - name: project_meta_indexing
    document_store: qdrant
  - name: sql_tables_extraction
    llm: litellm_llm.default
  - name: sql_diagnosis
    llm: litellm_llm.default
  - name: sql_knowledge_retrieval
    engine: wren_ibis
    document_store: qdrant

---
settings:
  doc_endpoint: https://docs.getwren.ai
  is_oss: true
  engine_timeout: 30
  column_indexing_batch_size: 50
  table_retrieval_size: 10
  table_column_retrieval_size: 100
  allow_intent_classification: true
  allow_sql_generation_reasoning: true
  allow_sql_functions_retrieval: true
  enable_column_pruning: false
  max_sql_correction_retries: 3
  query_cache_maxsize: 1000
  query_cache_ttl: 3600
  langfuse_host: https://cloud.langfuse.com
  langfuse_enable: false
  logging_level: DEBUG
  development: false
  historical_question_retrieval_similarity_threshold: 0.9
  sql_pairs_similarity_threshold: 0.7
  sql_pairs_retrieval_max_size: 10
  instructions_similarity_threshold: 0.7
  instructions_top_k: 10
